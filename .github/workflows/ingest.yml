name: ingest

on:
  # The 15-minute cron is disabled: the always-on local machine is now the sole
  # Telegram consumer, via scripts/publish_watcher.py (which runs ingest itself).
  # Two consumers of one bot's getUpdates would ack each other's messages and
  # lose captures — see scripts/ingest.py's offset docstring. workflow_dispatch
  # stays as a manual fallback for when the local machine is down; only ever run
  # it while the watcher is stopped.
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  # A second run must never start against the same offset/checkout while one
  # is still uploading media — wait for it rather than racing it.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Cache Telegram offset
        uses: actions/cache@v4
        with:
          path: ~/.field-notes/telegram-offset.json
          key: telegram-offset
          restore-keys: telegram-offset

      - name: Run ingest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ingest.py
